<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1030" viewBox="0 0 1500 1030" role="img" aria-labelledby="title desc">
  <title id="title">ContextGuard user journey and data flow</title>
  <desc id="desc">A diagram showing the project lead entering a decision, adding and previewing evidence, choosing checks, and running either the fictional sample or a live AI review. Both paths go through local deterministic citation checks, save to SQLite, and return an inspectable report. The user can clarify, recheck, and export a kickoff brief.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#53655a"/></marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#98713d"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#26342c}
      .title{font-size:34px;font-weight:700;letter-spacing:-.4px}
      .subtitle{font-size:17px;fill:#5b665e}
      .heading{font-size:18px;font-weight:700}
      .body{font-size:15px;fill:#455149}
      .small{font-size:13px;fill:#647067}
      .caps{font-size:12px;font-weight:700;letter-spacing:1.3px;fill:#55725f}
      .box{fill:#f5f2ea;stroke:#54725e;stroke-width:2}
      .ai{fill:#f5eee2;stroke:#98713d;stroke-width:2}
      .user{fill:#e7eee8;stroke:#315c49;stroke-width:2}
      .store{fill:#eef0eb;stroke:#58675d;stroke-width:2}
      .line{fill:none;stroke:#53655a;stroke-width:2.3;marker-end:url(#arrow)}
      .dash{fill:none;stroke:#98713d;stroke-width:2.3;stroke-dasharray:8 7;marker-end:url(#arrow-amber)}
    </style>
  </defs>
  <rect width="1500" height="1030" fill="#fbfaf6"/>
  <text x="64" y="68" class="title">ContextGuard · how a review moves</text>
  <text x="64" y="101" class="subtitle">Turn a project decision and its documents into evidence-linked questions for kickoff.</text>
  <rect x="64" y="128" width="1372" height="1" fill="#d9ddd5"/>

  <text x="64" y="170" class="caps">1 · WHAT THE USER DOES</text>
  <g>
    <rect x="64" y="194" width="242" height="118" rx="10" class="user"/>
    <text x="86" y="226" class="heading">Set the decision</text><text x="86" y="253" class="body">Goal and scope</text><text x="86" y="279" class="small">What needs to be decided?</text>
    <rect x="350" y="194" width="242" height="118" rx="10" class="box"/>
    <text x="372" y="226" class="heading">Add evidence</text><text x="372" y="253" class="body">PDF · DOCX · TXT · MD</text><text x="372" y="279" class="small">Or paste notes; preview passages</text>
    <rect x="636" y="194" width="242" height="118" rx="10" class="box"/>
    <text x="658" y="226" class="heading">Choose checks</text><text x="658" y="253" class="body">Keep the review in scope</text><text x="658" y="279" class="small">Exclude a check with a reason</text>
    <rect x="922" y="194" width="242" height="118" rx="10" class="user"/>
    <text x="944" y="226" class="heading">Run the review</text><text x="944" y="253" class="body">Sample or configured AI</text><text x="944" y="279" class="small">Progress is shown by stage</text>
    <rect x="1208" y="194" width="228" height="118" rx="10" class="user"/>
    <text x="1230" y="226" class="heading">Inspect and act</text><text x="1230" y="253" class="body">Answer · assign · recheck</text><text x="1230" y="279" class="small">Copy or download a kickoff brief</text>
    <path d="M306 253H340M592 253H626M878 253H912M1164 253H1198" class="line"/>
  </g>

  <text x="64" y="374" class="caps">2 · WHAT HAPPENS INSIDE THE LOCAL APP</text>
  <rect x="64" y="400" width="270" height="142" rx="10" class="box"/>
  <text x="88" y="434" class="heading">React workspace</text><text x="88" y="462" class="body">Setup · source preview</text><text x="88" y="487" class="body">Findings · map · history</text><text x="88" y="515" class="small">Runs in your browser</text>
  <rect x="398" y="400" width="270" height="142" rx="10" class="box"/>
  <text x="422" y="434" class="heading">FastAPI · localhost</text><text x="422" y="462" class="body">Accepts actions and files</text><text x="422" y="487" class="body">Tracks background run status</text><text x="422" y="515" class="small">Single-user local application</text>
  <rect x="732" y="400" width="270" height="142" rx="10" class="box"/>
  <text x="756" y="434" class="heading">Extract passages</text><text x="756" y="462" class="body">PDF pages · DOCX paragraphs</text><text x="756" y="487" class="body">Text and Markdown</text><text x="756" y="515" class="small">Source locations and limits retained</text>
  <rect x="1066" y="400" width="370" height="142" rx="10" class="store"/>
  <text x="1090" y="434" class="heading">SQLite · local case memory</text><text x="1090" y="462" class="body">Extracted text · report · answers</text><text x="1090" y="487" class="body">Run state · resolution history</text><text x="1090" y="515" class="small">Original uploaded file bytes are not retained</text>
  <path d="M334 471H388M668 471H722M1002 471H1056" class="line"/>
  <path d="M1205 312V362H531V390" class="line"/>

  <text x="64" y="606" class="caps">3 · TWO REVIEW PATHS, ONE CITATION CHECK</text>
  <rect x="64" y="632" width="280" height="128" rx="10" class="user"/>
  <text x="88" y="666" class="heading">Fictional sample</text><text x="88" y="694" class="body">Fixed sources and findings</text><text x="88" y="724" class="small">No AI call; useful product walkthrough</text>
  <rect x="64" y="790" width="280" height="128" rx="10" class="ai"/>
  <text x="88" y="824" class="heading">Your own review</text><text x="88" y="852" class="body">Goal + readable excerpts + checks</text><text x="88" y="882" class="small">Sent to configured provider(s)</text>
  <rect x="426" y="790" width="220" height="128" rx="10" class="ai"/>
  <text x="448" y="824" class="heading">Planner</text><text x="448" y="852" class="body">Evidence</text><text x="448" y="880" class="body">Challenge</text>
  <rect x="426" y="632" width="220" height="128" rx="10" class="box"/>
  <text x="448" y="666" class="heading">Fixture replay</text><text x="448" y="694" class="body">Same report pipeline</text><text x="448" y="724" class="small">Sample is explicitly labeled</text>
  <rect x="726" y="632" width="336" height="286" rx="10" class="box"/>
  <text x="750" y="670" class="heading">Deterministic verification</text><text x="750" y="706" class="body">Does each quote exist in its cited</text><text x="750" y="731" class="body">passage? Are references valid?</text><text x="750" y="770" class="body">Are conflicts supported by distinct</text><text x="750" y="795" class="body">quotes? Are duplicates removed?</text><text x="750" y="842" class="small">Checks citation structure, not truth or meaning.</text><text x="750" y="869" class="small">Uncertainty and parsing limits stay visible.</text>
  <rect x="1142" y="632" width="294" height="286" rx="10" class="user"/>
  <text x="1166" y="670" class="heading">What the user receives</text><text x="1166" y="706" class="body">Prioritized, source-linked findings</text><text x="1166" y="741" class="body">Exact quotes and source locations</text><text x="1166" y="776" class="body">Impact, uncertainty, a question</text><text x="1166" y="811" class="body">Coverage and review limitations</text><text x="1166" y="846" class="body">Editable, exportable kickoff brief</text><text x="1166" y="884" class="small">Supports a decision; never approves it</text>
  <path d="M344 696H416M344 854H416M646 696H716M646 854H716M1062 775H1132" class="line"/>

  <rect x="426" y="938" width="220" height="62" rx="9" class="ai"/>
  <text x="448" y="963" class="small">Primary: Meta Muse Wonder</text><text x="448" y="985" class="small">Optional fallback: Groq → NVIDIA NIM</text>
  <path d="M536 918V928" class="dash"/>
  <path d="M1289 918V953H1080V480H1076" class="line"/>
  <text x="1110" y="978" class="small">Save report and user decisions locally</text>
</svg>
